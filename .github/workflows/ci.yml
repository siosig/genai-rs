name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Development toolchain. Kept in sync with `rust-toolchain.toml`; the two
  # exist separately because the `msrv` and `clippy-latest` jobs deliberately
  # install something else.
  RUST_TOOLCHAIN: "1.96.0"
  # `rust-version` in Cargo.toml. Bumping one without the other is exactly what
  # the `msrv` job catches.
  RUST_MSRV: "1.85.0"

# Every `uses:` below is pinned to a full commit SHA rather than a tag. A tag is
# a mutable pointer: whoever controls the upstream repository can move it, and
# CI would run different code with no diff here. The trailing `# vX.Y.Z` comment
# is not decoration -- Dependabot reads it to work out the current version, and
# updates the SHA and the comment together.

jobs:
  fmt-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  # `rustfmt.toml` sets `group_imports` and `imports_granularity`, which are
  # nightly-only: stable `cargo fmt` ignores them silently, so the import
  # ordering AGENTS.md specifies is only actually checked here. Advisory --
  # nightly rustfmt can change formatting between releases, and that must not
  # be able to break the merge queue.
  fmt-check-nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      # `--locked` everywhere below: Cargo.lock is committed, so a run that
      # would have to change it is a run whose dependency graph differs from
      # the one this change was written against. Failing is the point.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  # Advisory counterpart to `clippy`: pinning the toolchain means new lints from
  # a fresh stable stop reaching us, so watch for them here without letting them
  # block a merge. Same pattern as `fmt-check-nightly`.
  clippy-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo test --workspace --all-features --locked

  # Makes `rust-version = "1.85"` in Cargo.toml mean something. The development
  # toolchain is deliberately newer, so nothing else in this workflow would
  # notice code (or a locked dependency) that needs a compiler the manifest
  # claims not to require.
  #
  # Not `--all-features`: the optional `mcp` feature pulls in rmcp, whose own
  # dependency tree requires 1.88. That is a property of an opt-in feature, not
  # of the crate, so the MSRV claim covers the default feature set plus
  # `blocking` -- see the note next to `rust-version` in Cargo.toml.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_MSRV }}
      - run: cargo check --workspace --locked
      - run: cargo check --workspace --locked --features blocking

  # The default feature set enables `live`, which pulls in tokio-tungstenite,
  # which enables tokio features this crate also relies on. That masked a
  # missing `io-util` in Cargo.toml for the entire life of the crate:
  # `--no-default-features` did not compile, and nothing ever ran it. Cargo
  # features are additive across the whole graph, so a crate that only builds
  # because a *sibling* enabled a feature is one dependency change away from
  # breaking. Check the combinations a consumer can actually select.
  features:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features rustls-tls"
          - "--no-default-features --features native-tls"
          - "--no-default-features --features live"
          - "" # defaults
          - "--features blocking"
          - "--features mcp"
          - "--all-features"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo check --workspace --locked ${{ matrix.features }}

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo doc --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  codegen-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # `--require-hashes` refuses to install anything whose artifact does not
      # match the hash in the lock. Without it, the generated output could
      # change because a transitive dependency (pydantic, say) shipped a new
      # release -- and `git diff --exit-code` below would blame the change
      # under review for it.
      - run: pip install --require-hashes -r tools/codegen/requirements.txt
      - run: python tools/codegen/generate.py
      - run: git diff --exit-code
