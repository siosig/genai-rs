name: Secret scan

# Server-side gate: unlike the commit hooks in `hooks/`, this cannot be skipped with
# `--no-verify`, and it applies to contributors who never ran the one-line hook setup.
# secretlint runs the committed preset config; the private denylist stays local by design
# and is enforced by the pre-commit hook. gitleaks adds broad coverage plus a full
# git-history scan.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  # Keep in sync with the version in `hooks/pre-commit`: a hook that flags what
  # CI accepts (or the reverse) trains people to ignore one of them.
  SECRETLINT_VERSION: "13.0.4"
  GITLEAKS_VERSION: "8.30.1"

# All `uses:` pinned to a commit SHA; see the comment in ci.yml for why.

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Pinned to the patch, not `@13`: a new patch can add or retune rules, and
      # a rule change that starts flagging an existing file turns CI red with no
      # change to this repository.
      - run: |
          npx -y \
            -p secretlint@${SECRETLINT_VERSION} \
            -p @secretlint/secretlint-rule-preset-recommend@${SECRETLINT_VERSION} \
            -p @secretlint/secretlint-rule-pattern@${SECRETLINT_VERSION} \
            secretlint "**/*"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Deliberately the CLI (MIT) rather than gitleaks/gitleaks-action, which
      # ships under a commercial EULA and requires a licence key for repositories
      # owned by an organisation. This repository is under a personal account
      # today, so the action would work -- and would break the day the repository
      # is transferred. The CLI has no such condition.
      #
      # The download is verified against the release's own checksums file, and
      # `set -euo pipefail` means a failed download fails the job instead of
      # being swallowed by a pipeline (the previous `curl | tar` did the latter).
      - name: Run gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${archive}" "${base}/${archive}"
          curl -sSfL -o checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${archive}\$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}" gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1
