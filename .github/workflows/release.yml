name: Release

# Publishes the crate to crates.io when a `vX.Y.Z` tag is pushed. No long-lived
# token is stored anywhere: the job authenticates with a short-lived OIDC
# credential that crates.io exchanges for a publish token scoped to this
# repository and workflow (Trusted Publishing), and the action revokes that
# token when the job ends. crates.io is configured, on the crate's settings
# page, to accept exactly this repository + workflow file + environment.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same toolchain as `ci.yml`; see the comment there.
  RUST_TOOLCHAIN: "1.96.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment name is part of what crates.io checks in the OIDC claim,
    # so a job elsewhere in this repository cannot mint a publish token just by
    # requesting `id-token: write`. It also gives a place to add required
    # reviewers later without touching this file.
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to check that the tagged commit is on `main`.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Three things that are cheap here and expensive to discover after the
      # upload: crates.io versions cannot be deleted, only yanked.
      - name: Check the tag against Cargo.toml and main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(cargo metadata --no-deps --format-version 1 --locked \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi
          if ! grep -qxF "## $manifest" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## $manifest' section"
            exit 1
          fi

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
