# Method inventory driving `gen_blocking.py` (`src/blocking/generated.rs`)
# and `gen_parity.py` (`docs/parity.md`). See
# specs/001-port-genai-rust/contracts/codegen.md, "methods.toml /
# gen_blocking.py / gen_parity.py".
#
# Because `gen_parity.py` cross-checks this file against
# `contracts/parity-matrix.md`, the inventory covers *every* ported public
# method, including ones `gen_blocking.py` never emits a wrapper for (the
# Live WebSocket surface, `Chat`'s stateful methods, nested-handle
# accessors). Those carry `kind = "session"` / `kind = "manual"`.
#
# Two tables:
#
# - `[[client_module]]`: the `Client`-accessor handles (`client.models()`,
#   `client.chats()`, ...). Each gets a generated `blocking::<struct>`
#   wrapper (`src/blocking/generated.rs`) holding a shared
#   `Arc<blocking::Runtime>` plus the wrapped async handle (`owner`).
# - `[[method]]`: one entry per async method on some handle type. `owner`
#   is that type's fully-qualified path -- for methods whose `owner`
#   matches a `[[client_module]]`'s `owner`, `gen_blocking.py` emits a
#   blocking wrapper method automatically, *if* `kind` is one of `unary`,
#   `stream`, `pager`, or `upload` (see below). Entries whose `kind` is
#   `session` or `manual` are intentionally skipped by the generator and
#   hand-written in `src/blocking/mod.rs` instead:
#
#   - `session`: methods on a stateful handle that is returned *by value*
#     rather than being a `Client` accessor (so it has no
#     `[[client_module]]` entry / no generated struct), and whose
#     streaming methods return values borrowing `&mut self`
#     (`ChatStream<'_>`, `LiveSession::receive`) -- a shape the
#     generator's uniform `fn(&self, ..) -> Result<..>` template can't
#     express without per-method lifetime handling. `crate::chats::Chat`
#     is hand-written as `blocking::Chats::create` / `blocking::Chat`;
#     the Live handles have no blocking counterpart at all (see the
#     `live` section below).
#   - `manual`: `Operations::get<T>` is generic over `T: OperationLike +
#     Serialize + DeserializeOwned`; the `args`/`ret` string format below
#     has no way to express a type parameter or its bounds. Hand-written
#     as an inherent `impl` on the generated `blocking::Operations`
#     struct. `FileSearchStores::documents()` is likewise `manual`: it is
#     a nested-handle accessor (mirroring `Client::file_search_stores()`
#     itself), not an API call, so it doesn't fit the `unary`/`stream`/
#     `pager`/`upload` shapes either.
#
# `args` entries are literal `"name: type"` strings (split once on `": "`);
# `ret` is the `T` in the wrapped method's `Result<T>` for `unary`/`upload`,
# or the item type for `stream` (`Stream<Item = Result<T>>`) / `pager`
# (`Pager<T>`). All non-primitive types are written fully qualified
# (`crate::types::X`, `bytes::Bytes`, ...) so `gen_blocking.py` never has to
# guess an import.

