overview_p2 = "この表は `tools/codegen/methods.toml`（メソッド台帳）と `tools/codegen/parity-matrix.ja.md`（合意済みの真実の源）から生成している。対応表が ✅ と記した項目が台帳から欠けていれば `gen_parity.py` は非ゼロ終了し、CI の `codegen-check` が落ちる。"

