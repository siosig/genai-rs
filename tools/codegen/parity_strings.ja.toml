# Japanese strings for gen_parity.py (renders docs/parity.ja.md).
#
# Kept out of gen_parity.py itself because the repository's pre-commit hook
# rejects CJK outside `*.ja*` files, and `\uXXXX`-escaping a whole document's
# prose would be unreadable. Every key below is required: gen_parity.py exits
# non-zero if one is missing, so adding a string to the English locale forces a
# Japanese counterpart.

title = "Python → Rust 対応表"
cross_link = "English version: [parity.md](parity.md)"
out_file = "docs/parity.ja.md"

baseline = "**基準**: google-genai {version} | **クレート**: `gemini-genai`（`gemini_genai`） | **真実の源**: `tools/codegen/parity-matrix.ja.md`"

