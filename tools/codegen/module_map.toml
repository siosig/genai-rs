# Upstream module -> Rust file(s). See specs/008-python-genai-rust-conformance/
# contracts/module-map.md. `rust` entries are repo-relative paths or globs
# (`**` = any depth). `converters = true` marks modules whose `_X_to_mldev` /
# `_X_from_mldev` functions are generated into src/converters/generated/<stem>.rs
# (the leading underscore of the upstream module name is dropped).
# `out_of_scope = true` modules need `reason_code` and `reason`.

[[module]]
upstream = "__init__"
rust = ["src/lib.rs"]

[[module]]
upstream = "version"
rust = ["src/lib.rs"]

[[module]]
upstream = "client"
rust = ["src/client.rs"]

[[module]]
upstream = "_base_url"
rust = ["src/base_url.rs"]

[[module]]
upstream = "_api_client"
rust = ["src/api_client/**"]

[[module]]
upstream = "_api_module"
out_of_scope = true
reason_code = "structural"
reason = "Python base class for the resource modules; Rust resource handles hold a shared API client instead."

