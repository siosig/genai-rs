[package]
name = "google-genai-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Rust port of the Google Gen AI Python SDK (google-genai) for the Gemini Developer API"
license = "Apache-2.0"
repository = "https://github.com/googleapis/python-genai"
readme = "README.md"
keywords = ["gemini", "genai", "google", "llm", "ai"]
categories = ["api-bindings", "asynchronous"]

[lib]
name = "google_genai"
path = "src/lib.rs"

[features]
default = ["rustls-tls", "live"]
rustls-tls = ["reqwest/rustls", "reqwest/webpki-roots", "tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
live = ["dep:tokio-tungstenite"]
blocking = ["dep:once_cell"]
mcp = ["dep:rmcp"]
live-tests = []

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart"] }
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "fs", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["base64"] }
thiserror = "2"
backon = "1.6"
bytes = "1"
url = "2"
base64 = "0.23"
mime_guess = "2"
secrecy = "0.10"
tracing = "0.1"
schemars = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
once_cell = { version = "1", optional = true }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "handshake"] }
rmcp = { version = "3", optional = true }

[dev-dependencies]
wiremock = "0.6"
rstest = "0.26"
insta = { version = "1.48", features = ["json"] }
tokio-test = "0.4"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 3 }
redundant_clone = "deny"
unwrap_used = "deny"
expect_used = "deny"
