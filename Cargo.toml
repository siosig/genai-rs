[package]
name = "gemini-genai"
version = "0.1.0"
edition = "2024"
# Minimum supported Rust version, for the default feature set plus `blocking`.
# The optional `mcp` feature is NOT covered: rmcp's dependency tree requires
# 1.88, and that is a cost of opting into MCP rather than a property of this
# crate. The `msrv` CI job checks exactly the combinations this line claims.
rust-version = "1.85"
description = "Unofficial Rust port of the Google Gen AI Python SDK (google-genai) for the Gemini Developer API. Not affiliated with Google."
license = "Apache-2.0"
repository = "https://github.com/siosig/genai-rs"
readme = "README.md"
keywords = ["gemini", "genai", "llm", "ai", "sdk"]
categories = ["api-bindings", "asynchronous"]
# Development tooling; regenerating requires a Python interpreter and the
# google-genai package, neither of which a consumer of the crate has.
exclude = ["tools/", "specs/", ".github/"]

# The upstream Python SDK release this port is generated from and verified
# against. `google-genai` ships frequently; every generated file stamps this
# same version in its header, `tools/codegen/upstream.py` is the single source
# of truth that enforces it, and `tools/codegen/requirements.txt` pins the
# matching install. See `tools/codegen/upstream.py` for the upgrade procedure.
[package.metadata.upstream]
python-sdk = "google-genai"
version = "2.19.0"
backend = "gemini-developer-api"

[lib]
name = "gemini_genai"
path = "src/lib.rs"

[features]
default = ["rustls-tls", "live"]
rustls-tls = ["reqwest/rustls", "reqwest/webpki-roots", "tokio-tungstenite/rustls-tls-webpki-roots"]
native-tls = ["reqwest/native-tls", "tokio-tungstenite/native-tls"]
live = ["dep:tokio-tungstenite"]
blocking = ["dep:once_cell"]
mcp = ["dep:rmcp"]

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "multipart"] }
# `io-util` supplies AsyncReadExt, which `src/http/upload.rs` uses to read a file
# in chunks for resumable upload. It is not listed by accident being harmless:
# without it `--no-default-features` fails to compile, and it only ever built
# because another dependency happened to enable the feature for us. Cargo
# features are additive across the graph, so relying on that is relying on a
# dependency's own feature choices not changing.
tokio = { version = "1.53", features = ["rt", "rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
futures-core = "0.3"
futures-util = "0.3"
async-stream = "0.3"
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "3", features = ["base64"] }
thiserror = "2"
backon = "1.6"
bytes = "1"
url = "2"
base64 = "0.23"
mime_guess = "2"
secrecy = "0.10"
tracing = "0.1"
schemars = "1"
async-trait = "0.1"
# Jitter for the retry backoff. Already in the tree via
# tokio-tungstenite, but declared directly since `retry` is not
# gated behind the `live` feature.
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
once_cell = { version = "1", optional = true }
tokio-tungstenite = { version = "0.30", optional = true, default-features = false, features = ["connect", "handshake"] }
rmcp = { version = "3", optional = true, features = ["client"] }

[dev-dependencies]
wiremock = "0.6"
rstest = "0.26"
# Lets tests read tools/codegen/methods.toml, so the async/blocking API
# symmetry check is driven by the same ledger the generator uses.
toml = "1.1"

[lints.rust]
missing_docs = "deny"
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = 10 }
pedantic = { level = "warn", priority = 3 }
redundant_clone = "deny"
unwrap_used = "deny"
expect_used = "deny"
